name: ⚙️ Koda Tech Mission

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  koda-response:
    if: |
      (
        contains(github.event.issue.labels.*.name, 'agent-koda') ||
        contains(github.event.comment.body, '@koda') ||
        github.event_name == 'workflow_dispatch'
      ) &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Packages
        run: pip install requests pyyaml python-dotenv anthropic

      - name: ⚙️ Execute Koda Tech Mission
        id: koda_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_NAME: koda
          AGENT_ROLE: CTO
        run: |
          ISSUE_URL="${{ github.event.issue.html_url }}"
          COMMENT_BODY="${{ github.event.comment.body }}"
          AUTHOR="${{ github.event.comment.user.login }}"
          # issue opened/labeled 이벤트는 comment 없음 — issue body 폴백
          if [ -z "$COMMENT_BODY" ]; then
            COMMENT_BODY="${{ github.event.issue.body }}"
            AUTHOR="${{ github.event.issue.user.login }}"
          fi
          python scripts/koda_mission.py \
            --issue "$ISSUE_URL" \
            --comment "$COMMENT_BODY" \
            --author "$AUTHOR"

      - name: 🚨 Escalate if Review Needed
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ **Human Review Required**\n@TRANG @Kbin — Koda 기술 검토 요청"
            });
